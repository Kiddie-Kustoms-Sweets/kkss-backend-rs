[package]
name = "kkss-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.14.1", features=["rustls"] }
actix-cors = "0.7.1"
env_logger = "0.11.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
sea-orm = { version = "2.0", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
bcrypt = "0.19"
toml = "1.1"
thiserror = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
regex = "1.13"
md5 = "0.8"
rand = "0.10"
log = "0.4"
futures-util = "0.3"
utoipa = { version = "5.5", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["actix-web"] }
async-stripe = { version = "0.41.0", features = ["runtime-tokio-hyper-rustls-webpki", "checkout", "billing", "connect", "webhook-endpoints"] }

[dependencies.migration]
path = "migration"


[workspace]
members = [".", "migration"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

